<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0" spreadMethod="repeat">
      <stop offset="0"   stop-color="#003f87"/>
      <stop offset="0.5" stop-color="#00c4cc"/>
      <stop offset="1"   stop-color="#003f87"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#g)"/>
</svg>
